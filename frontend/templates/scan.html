{% extends "base.html" %}
{% block title %}Take attendance{% endblock %}
{% block content %}
<div class="split">
  <section class="panel">
    <div class="stage">
      <div class="portal" id="portal" data-state="idle">
        <div class="portal-view"><video id="video" autoplay playsinline muted></video></div>
      </div>
      <div class="verdict" id="verdict" aria-live="polite">
        <h2 id="who">Starting camera</h2>
        <p id="sub">Allow camera access when your browser asks.</p>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Marked present today</h2>
    <ul class="ledger" id="today"></ul>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='camera.js') }}"></script>
<script>
const video = document.getElementById('video');
const portal = document.getElementById('portal');
const verdict = document.getElementById('verdict');
const who = document.getElementById('who'), sub = document.getElementById('sub');
const list = document.getElementById('today');
let busy = false, cooldownUntil = 0, freshRoll = null;

function show(state, title, text) {
  portal.dataset.state = state;
  verdict.className = 'verdict ' + (state === 'idle' ? '' : state);
  who.textContent = title; sub.textContent = text || '';
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function refreshToday() {
  const rows = await (await fetch('/api/today')).json();
  list.innerHTML = rows.length
    ? rows.map(r => `<li class="${r.roll_no === freshRoll ? 'fresh' : ''}"><time>${esc(r.time.slice(0, 5))}</time><span class="roll">${esc(r.roll_no)}</span><span class="name">${esc(r.name)}</span></li>`).join('')
    : '<li class="empty">No one has checked in yet today.</li>';
}

async function tick() {
  if (busy || Date.now() < cooldownUntil) return;
  busy = true;
  try {
    const res = await fetch('/api/recognize', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({image: Cam.grab(video, 0.8)})
    });
    if (res.status === 401) { location.href = '/kiosk-access'; return; }
    const d = await res.json();
    switch (d.status) {
      case 'marked':
        freshRoll = d.roll_no;
        show('ok', d.name, `Marked present at ${d.time.slice(0, 5)}.`);
        cooldownUntil = Date.now() + 4000; refreshToday(); break;
      case 'already':
        show('warn', d.name, `You were already marked today at ${d.time.slice(0, 5)}.`);
        cooldownUntil = Date.now() + 4000; break;
      case 'unknown':
        show('bad', 'Face not recognised', 'Move closer and face the camera. If this keeps happening, ask your administrator to register you.'); break;
      case 'no_model':
        show('warn', 'No students registered', 'An administrator needs to register students first.'); break;
      case 'no_face':
        show('idle', 'Looking for a face', 'Stand about an arm\u2019s length from the camera.'); break;
      default: show('bad', 'Could not read the camera image', 'Reload the page and try again.');
    }
  } catch (e) { show('bad', 'Cannot reach the server', 'Check your internet connection.'); }
  busy = false;
}

Cam.start(video)
  .then(() => { show('idle', 'Looking for a face', 'Stand about an arm\u2019s length from the camera.'); setInterval(tick, 1200); refreshToday(); })
  .catch(() => show('bad', 'Camera is blocked', 'Allow camera access in the address bar, then reload. The page must be opened over HTTPS.'));
</script>
{% endblock %}
