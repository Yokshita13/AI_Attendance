{% extends "base.html" %}
{% block title %}Admin sign in{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1 style="margin-bottom:6px">Admin sign in</h1>
  <p class="muted" style="margin-bottom:22px">Manage students and view attendance reports.</p>
  <form method="post" class="form">
    <label>Username <input name="username" required autofocus autocomplete="username"></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
