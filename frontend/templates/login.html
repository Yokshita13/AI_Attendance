{% extends "auth_base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Admin sign in{% endblock %}
{% block top_link %}Student? <a href="{{ url_for('student_login') }}">Sign in here</a>{% endblock %}
{% block card %}
  <h1>Welcome back!</h1>
  <p class="lead">Sign in to manage students and attendance.</p>
  <form method="post" class="form">
    <div class="field"><label for="u">Username</label>
      <div class="control">{{ icon('user') }}<input id="u" name="username" placeholder="Enter your username" required autofocus autocomplete="username"></div></div>
    <div class="field"><label for="p">Password</label>
      <div class="control">{{ icon('lock') }}<input id="p" type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
        <button class="eye" type="button" data-for="p" aria-label="Show password">{{ icon('eye') }}</button></div></div>
    <button class="btn block" type="submit">Sign in</button>
  </form>
{% endblock %}
